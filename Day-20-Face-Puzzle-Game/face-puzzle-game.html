<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Face Puzzle — Snap, Scramble, Solve</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.13/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.13/500-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.css">
<style>
  :root{
    --ink:#14110f;
    --surface:#1e1a17;
    --surface-2:#28221e;
    --hairline:#3a332d;
    --paper:#f5efe6;
    --muted:#a89a8c;
    --coral:#ff6b4a;
    --coral-dim:#7a3a2b;
    --amber:#ffb238;
    --mint:#34d399;
    --shadow: 0 20px 60px rgba(0,0,0,.45);
    --radius: 18px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, #241f1b 0%, var(--ink) 60%);
    color:var(--paper);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 32px 16px 64px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  ::selection{ background:var(--coral); color:#1a1a1a; }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

  .app{
    width:100%;
    max-width:600px;
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--hairline);
    border-radius:24px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }

  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding:22px 26px 0;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--coral);
  }
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(26px,6vw,34px);
    margin:2px 0 18px;
    letter-spacing:-0.01em;
  }

  .screen{ padding: 0 26px 26px; }
  .hidden{ display:none !important; }

  /* ---------- Aperture frame (signature element) ---------- */
  .aperture{
    position:relative;
    width:min(78vw, 380px);
    aspect-ratio:1/1;
    margin:6px auto 18px;
    border-radius:50%;
    padding:10px;
    background:
      conic-gradient(from 0deg,
        var(--coral) 0deg 24deg, transparent 24deg 40deg,
        var(--coral) 40deg 64deg, transparent 64deg 80deg,
        var(--coral) 80deg 104deg, transparent 104deg 120deg,
        var(--coral) 120deg 144deg, transparent 144deg 160deg,
        var(--coral) 160deg 184deg, transparent 184deg 200deg,
        var(--coral) 200deg 224deg, transparent 224deg 240deg,
        var(--coral) 240deg 264deg, transparent 264deg 280deg,
        var(--coral) 280deg 304deg, transparent 304deg 320deg,
        var(--coral) 320deg 344deg, transparent 344deg 360deg);
    opacity:.9;
    animation: iris-breathe 6s ease-in-out infinite;
  }
  @keyframes iris-breathe{
    0%,100%{ transform:scale(1); opacity:.85; }
    50%{

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<style>
  :root{
    --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
    --accent:#6c5ce7; --accent2:#00d2ff; --accent3:#3a7bd5;
    --good:#00e676; --warn:#ffb300; --bad:#ff5252;
    --glass:rgba(255,255,255,0.06); --glassBorder:rgba(255,255,255,0.14);
    --text:#f1f2f6; --textDim:#b9bbd1;
    --radius:16px;
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    background-attachment:fixed;
    color:var(--text);
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(108,92,231,0.25), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,210,255,0.18), transparent 45%);
    pointer-events:none; z-index:0;
  }
  #app{position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:24px 18px 60px;}
  h1,h2,h3{font-weight:700;}
  .glass{
    background:var(--glass);
    border:1px solid var(--glassBorder);
    border-radius:var(--radius);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
  }
  .header{
    text-align:center; padding:28px 20px; margin-bottom:22px;
    animation:fadeDown .6s ease;
  }
  .header h1{
    font-size:clamp(1.5rem,4vw,2.3rem);
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:.5px;
  }
  .header p{color:var(--textDim); margin-top:8px; font-size:.95rem;}
  @keyframes fadeDown{from{opacity:0; transform:translateY(-16px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
  @keyframes popIn{0%{opacity:0; transform:scale(.85);} 100%{opacity:1; transform:scale(1);}}
  @keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.04);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);}}
  @keyframes floatUp{0%{opacity:0; transform:translateY(10px);} 15%{opacity:1; transform:translateY(0);} 85%{opacity:1;} 100%{opacity:0; transform:translateY(-24px);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes shimmer{0%{background-position:-200% 0;} 100%{background-position:200% 0;}}

  .btn{
    cursor:pointer; border:none; border-radius:12px; padding:12px 22px;
    font-size:.95rem; font-weight:600; color:#fff;
    background:linear-gradient(90deg,var(--accent),var(--accent3));
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow:0 4px 14px rgba(108,92,231,0.4);
  }
  .btn:hover{transform:translateY(-2px) scale(1.02); filter:brightness(1.1); box-shadow:0 8px 22px rgba(108,92,231,0.55);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn.secondary{background:rgba(255,255,255,0.08); box-shadow:none; border:1px solid var(--glassBorder);}
  .btn.secondary:hover{background:rgba(255,255,255,0.15);}
  .btn.ghost{background:transparent; border:1px dashed var(--glassBorder); box-shadow:none;}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none;}

  /* ---- Screen: setup ---- */
  .setup-card{padding:32px; text-align:center; animation:popIn .5s ease;}
  .setup-card h2{margin-bottom:6px;}
  .setup-card p{color:var(--textDim); margin-bottom:20px;}
  .pill{
    display:inline-block; padding:6px 14px; border-radius:999px;
    background:rgba(255,255,255,0.08); border:1px solid var(--glassBorder);
    font-size:.8rem; margin:4px; color:var(--textDim);
  }

  /* ---- Progress bar ---- */
  .progress-wrap{display:flex; align-items:center; gap:14px; margin-bottom:18px; animation:fadeDown .5s ease;}
  .progress-track{flex:1; height:10px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden;}
  .progress-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .5s ease;}
  .stat-chip{
    display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px;
    background:rgba(255,255,255,0.06); border:1px solid var(--glassBorder); font-size:.82rem; white-space:nowrap;
  }
  .stat-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}

  /* ---- Scenario card ---- */
  .scenario-card{padding:24px; margin-bottom:20px; animation:fadeUp .45s ease;}
  .scenario-tag{
    display:inline-block; font-size:.72rem; text-transform:uppercase; letter-spacing:1px;
    padding:4px 10px; border-radius:8px; background:rgba(108,92,231,0.25); color:#c9c3ff; margin-bottom:10px;
  }
  .scenario-goal{font-size:1.05rem; font-weight:600; margin-bottom:4px;}
  .scenario-desc{color:var(--textDim); font-size:.9rem; margin-bottom:16px; line-height:1.5;}

  .blocks-zone{
    display:flex; flex-wrap:wrap; gap:10px; min-height:60px;
    padding:14px; border-radius:12px; background:rgba(0,0,0,0.18);
    border:2px dashed rgba(255,255,255,0.15); margin-bottom:14px; transition:border-color .2s ease, background .2s ease;
  }
  .blocks-zone.dragover{border-color:var(--accent2); background:rgba(0,210,255,0.08);}
  .blocks-zone-label{width:100%; font-size:.78rem; color:var(--textDim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px;}

  .block{
    cursor:grab; user-select:none; padding:10px 14px; border-radius:10px;
    background:linear-gradient(135deg,rgba(108,92,231,0.35),rgba(58,123,213,0.35));
    border:1px solid rgba(255,255,255,0.2); font-size:.86rem; line-height:1.3;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    max-width:280px;
  }
  .block:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,0.35);}
  .block.dragging{opacity:.4;}
  .block.correct-flash{animation:pulse .4s ease; box-shadow:0 0 0 2px var(--good);}
  .block.wrong-flash{animation:shake .4s ease; box-shadow:0 0 0 2px var(--bad);}
  .block.distractor-marker{border-style:dashed;}
  .block.locked{cursor:default; opacity:.85;}
  .block .rm{float:right; margin-left:8px; opacity:.6; font-weight:700;}
  .block .rm:hover{opacity:1; color:var(--bad);}

  .choice-option{
    text-align:left; width:100%; padding:14px 16px; margin-bottom:10px; border-radius:12px;
    background:rgba(255,255,255,0.05); border:1px solid var(--glassBorder); cursor:pointer;
    transition:all .15s ease; font-size:.88rem; line-height:1.5; white-space:pre-wrap; font-family:inherit;
  }
  .choice-option:hover{background:rgba(255,255,255,0.1); transform:translateX(4px);}
  .choice-option.selected-correct{border-color:var(--good); background:rgba(0,230,118,0.12);}
  .choice-option.selected-wrong{border-color:var(--bad); background:rgba(255,82,82,0.12); animation:shake .4s ease;}
  .choice-option.reveal-correct{border-color:var(--good); box-shadow:0 0 0 1px var(--good);}
  .choice-option small{display:block; color:var(--textDim); margin-top:6px;}

  .clean-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .clean-item{
    display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px;
    background:rgba(255,255,255,0.05); border:1px solid var(--glassBorder); font-size:.86rem; cursor:pointer;
    transition:all .15s ease;
  }
  .clean-item:hover{background:rgba(255,255,255,0.1);}
  .clean-item.kept{border-color:var(--accent2);}
  .clean-item.removed{opacity:.35; text-decoration:line-through;}
  .clean-item .chk{
    width:18px; height:18px; border-radius:5px; border:2px solid var(--textDim); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:.7rem;
  }
  .clean-item.kept .chk{background:var(--accent2); border-color:var(--accent2); color:#052;}

  .action-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center;}

  .feedback-box{
    margin-top:14px; padding:14px 16px; border-radius:12px; font-size:.86rem; line-height:1.5;
    animation:fadeUp .3s ease; border:1px solid var(--glassBorder);
  }
  .feedback-box.good{background:rgba(0,230,118,0.1); border-color:var(--good);}
  .feedback-box.bad{background:rgba(255,82,82,0.1); border-color:var(--bad);}
  .feedback-box code{background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:6px; font-size:.82rem;}
  .compare-grid{display:grid; grid-template-columns:1fr; gap:12px; margin-top:12px;}
  @media(min-width:720px){.compare-grid{grid-template-columns:1fr 1fr;}}
  .compare-box{padding:12px 14px; border-radius:10px; background:rgba(0,0,0,0.2); border:1px solid var(--glassBorder);}
  .compare-box h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.5px; color:var(--textDim); margin-bottom:6px;}
  .compare-box.weak h4{color:#ff9e9e;}
  .compare-box.optimized h4{color:#7dffb0;}
  .compare-box p{font-size:.84rem; line-height:1.5; white-space:pre-wrap;}

  /* ---- Notifications ---- */
  #toastWrap{position:fixed; top:18px; right:18px; z-index:999; display:flex; flex-direction:column; gap:10px; align-items:flex-end;}
  .toast{
    padding:12px 18px; border-radius:12px; font-size:.85rem; font-weight:600;
    background:rgba(20,18,40,0.9); border:1px solid var(--glassBorder); box-shadow:0 8px 24px rgba(0,0,0,0.4);
    animation:floatUp 2.6s ease forwards; max-width:280px;
  }
  .toast.good{border-color:var(--good); color:#7dffb0;}
  .toast.bad{border-color:var(--bad); color:#ff9e9e;}
  .toast.info{border-color:var(--accent2); color:#a9e8ff;}

  /* ---- Score float ---- */
  .score-pop{
    position:fixed; pointer-events:none; font-weight:800; font-size:1.4rem; z-index:998;
    animation:floatUp 1.1s ease forwards;
  }

  /* ---- Report ---- */
  .report-card{padding:32px; animation:popIn .5s ease;}
  .report-hero{text-align:center; margin-bottom:26px;}
  .report-score{
    font-size:3.4rem; font-weight:800;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .report-rank{font-size:1.2rem; font-weight:700; margin-top:4px;}
  .report-rating{color:var(--textDim); margin-top:4px;}
  .metrics-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:22px 0;}
  @media(min-width:600px){.metrics-grid{grid-template-columns:repeat(3,1fr);}}
  .metric-box{padding:14px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid var(--glassBorder); text-align:center;}
  .metric-box .val{font-size:1.4rem; font-weight:700; color:var(--accent2);}
  .metric-box .lbl{font-size:.74rem; color:var(--textDim); text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}

  .dna-wrap{margin:22px 0;}
  .dna-title{font-size:.85rem; text-transform:uppercase; letter-spacing:1px; color:var(--textDim); margin-bottom:10px;}
  .dna-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .dna-label{width:120px; font-size:.8rem; color:var(--textDim); flex-shrink:0;}
  .dna-track{flex:1; height:12px; border-radius:6px; background:rgba(255,255,255,0.07); overflow:hidden;}
  .dna-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent)); width:0; transition:width 1s ease;}
  .dna-val{width:40px; text-align:right; font-size:.78rem; color:var(--textDim);}

  .feedback-block{padding:16px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid var(--glassBorder); margin-bottom:14px; font-size:.9rem; line-height:1.6;}
  .milestone-block{padding:16px; border-radius:12px; background:rgba(0,210,255,0.08); border:1px solid rgba(0,210,255,0.3); margin-bottom:14px; font-size:.88rem; line-height:1.6;}
  .final-prompt-block{padding:16px; border-radius:12px; background:rgba(0,0,0,0.25); border:1px solid var(--glassBorder); font-size:.86rem; line-height:1.6; white-space:pre-wrap; font-family:'Consolas',monospace;}

  .hint-btn{position:relative;}
  .hint-badge{
    position:absolute; top:-8px; right:-8px; background:var(--warn); color:#3a2600; font-size:.65rem;
    font-weight:800; border-radius:999px; padding:1px 6px;
  }

  footer{text-align:center; color:var(--textDim); font-size:.78rem; margin-top:30px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:4px;}
</style>
</head>
<body>
<div id="toastWrap"></div>
<div id="app"></div>

<script>
(function(){
"use strict";

/* =========================================================
   DOMAIN / DIFFICULTY (fixed per this generation)
   ========================================================= */
const DOMAIN = "Software Development & Coding";
const DIFFICULTY = "Beginner";

/* =========================================================
   SCENARIO DATA — reusable JS objects
   ========================================================= */
const SCENARIOS = [
  {
    id: "s1",
    type: "build",
    goal: "Get AI to write a Python function that reverses a string",
    desiredOutput: "A correct, well-documented Python function `reverse_string(s)` that returns the reversed string, with a docstring and one usage example.",
    correctBlocks: [
      "Write a Python function named reverse_string(s)",
      "It should return the input string reversed",
      "Include a docstring explaining parameters and return value",
      "Add one example usage in a comment below the function"
    ],
    distractorBlocks: [
      "Make it work in every programming language at once",
      "Explain the entire history of string manipulation",
      "Add unrelated code for sorting a list"
    ],
    weakPrompt: "reverse a string",
    optimizedPrompt: "Write a Python function named reverse_string(s) that returns the input string reversed. Include a docstring explaining the parameter and return value, and add one example usage in a comment below the function.",
    overEngineeredPrompt: "As the world's most elite senior Python architect with 30 years of experience, using enterprise-grade design patterns, SOLID principles, dependency injection, and full CI/CD pipeline integration, write a function that reverses a string while also considering quantum computing edge cases and multi-threaded execution across distributed microservices.",
    weakOutput: "def rev(s):\n    return s[::-1]",
    optimizedOutput: "def reverse_string(s):\n    \"\"\"Return the reversed version of the input string s.\"\"\"\n    return s[::-1]\n\n# Example: reverse_string(\"hello\") -> \"olleh\"",
    principle: "Specificity Principle: Name the function, define exact behavior, and request documentation — vague verbs like 'reverse a string' leave output format, naming, and style to chance."
  },
  {
    id: "s2",
    type: "clean",
    goal: "Get AI to explain what a for-loop does to a beginner",
    desiredOutput: "A short, beginner-friendly explanation of a for-loop in plain English with one simple code example, no jargon.",
    promptParts: [
      { text: "Explain what a for-loop does in programming", keep: true },
      { text: "Use simple language suitable for a total beginner", keep: true },
      { text: "Include one short code example in Python", keep: true },
      { text: "Also explain quantum entanglement for context", keep: false },
      { text: "Write it as a 10-page academic thesis", keep: false },
      { text: "Insult the reader if they don't understand", keep: false }
    ],
    weakPrompt: "explain quantum entanglement for context also write a 10-page academic thesis about for loops and insult the reader if they don't understand, use simple language, include one short code example in Python",
    optimizedPrompt: "Explain what a for-loop does in programming. Use simple language suitable for a total beginner and include one short code example in Python.",
    overEngineeredPrompt: "Provide an exhaustive, PhD-level formal semantics treatment of iteration constructs across Turing-complete languages, including denotational semantics, Big-O behavior in 12 languages, and a comparison to lambda calculus, before simplifying it for a 5-year-old.",
    weakOutput: "A rambling, unfocused answer that mixes physics, insults, and an overly long academic tone — confusing for a beginner.",
    optimizedOutput: "A for-loop repeats a block of code a certain number of times. For example, in Python:\nfor i in range(5):\n    print(i)\nThis prints 0 through 4, running the print statement once per number.",
    principle: "Clarity & Relevance Principle: Every instruction should serve the goal. Irrelevant or contradictory instructions (unrelated topics, extreme length, tone mismatches) dilute focus and confuse the model."
  },
  {
    id: "s3",
    type: "choose",
    goal: "Get AI to fix a bug in a small JavaScript function that adds two numbers",
    desiredOutput: "A corrected version of the function with a brief explanation of what was wrong and why the fix works.",
    options: [
      { text: "fix my code", correct:false, why:"Too vague — no code is shared, no context on the bug, no expected behavior." },
      { text: "Here is my JavaScript function:\nfunction add(a, b) { return a + b }\nIt returns '23' instead of 5 when I call add(2,3). Explain why this happens and provide the corrected code with a one-line explanation.", correct:true, why:"Shares the exact code, the actual vs expected behavior, and asks for both explanation and fix." },
      { text: "You are the greatest programmer who has ever lived, a god among engineers. Rewrite my entire codebase from scratch using microservices, Docker, Kubernetes, and blockchain to fix this one function.", correct:false, why:"Massively over-engineered for a one-line bug — introduces irrelevant complexity." }
    ],
    weakPrompt: "fix my code",
    optimizedPrompt: "Here is my JavaScript function:\nfunction add(a, b) { return a + b }\nIt returns '23' instead of 5 when I call add(2,3). Explain why this happens and provide the corrected code with a one-line explanation.",
    overEngineeredPrompt: "You are the greatest programmer who has ever lived, a god among engineers. Rewrite my entire codebase from scratch using microservices, Docker, Kubernetes, and blockchain to fix this one function.",
    weakOutput: "Can you share the code you're referring to? I don't have enough information to help.",
    optimizedOutput: "The bug happens because a and b are being passed as strings, so + concatenates them instead of adding numerically. Fix:\nfunction add(a, b) { return Number(a) + Number(b); }\nThis converts both inputs to numbers before adding.",
    principle: "Context Principle: Always include the actual code, the observed vs expected behavior, and a clear ask — this removes ambiguity and lets the model diagnose precisely."
  },
  {
    id: "s4",
    type: "build",
    goal: "Get AI to write a simple HTML button that shows an alert when clicked",
    desiredOutput: "A minimal, working HTML snippet with a button element and inline or script-based onclick handler that triggers a JavaScript alert.",
    correctBlocks: [
      "Write a single HTML button element",
      "When clicked, it should trigger a JavaScript alert saying 'Hello!'",
      "Keep the code minimal — no external libraries",
      "Show the complete, ready-to-run code snippet"
    ],
    distractorBlocks: [
      "Make it a full e-commerce checkout system",
      "Add animated 3D graphics using WebGL",
      "Include a backend database connection"
    ],
    weakPrompt: "make a button that does something",
    optimizedPrompt: "Write a single HTML button element that triggers a JavaScript alert saying 'Hello!' when clicked. Keep the code minimal with no external libraries, and show the complete, ready-to-run code snippet.",
    overEngineeredPrompt: "Design a fully responsive, animated, WebGL-powered, accessibility-certified, internationalized button component with a full design system, unit tests, and CI pipeline just to show one alert message.",
    weakOutput: "<button>Click</button>\n<!-- missing onclick, incomplete -->",
    optimizedOutput: "<button onclick=\"alert('Hello!')\">Click Me</button>",
    principle: "Minimalism Principle: For simple tasks, request only what's needed. Clear scope ('minimal', 'no external libraries') prevents the model from over-building."
  },
  {
    id: "s5",
    type: "clean",
    goal: "Get AI to write a Python list comprehension that filters even numbers from a list",
    desiredOutput: "A single-line list comprehension that returns only even numbers from a given list, with a short example.",
    promptParts: [
      { text: "Write a Python list comprehension that returns only even numbers from a list called numbers", keep: true },
      { text: "Show one example with a sample list and the resulting output", keep: true },
      { text: "Keep the solution to a single line of code", keep: true },
      { text: "Also convert the entire script to Java, C++, and Rust", keep: false },
      { text: "Add a 500-word essay about the history of list comprehensions", keep: false }
    ],
    weakPrompt: "also convert the entire script to Java, C++, and Rust and write a Python list comprehension that returns only even numbers from a list called numbers, add a 500-word essay about the history of list comprehensions, show one example",
    optimizedPrompt: "Write a Python list comprehension that returns only even numbers from a list called numbers. Keep the solution to a single line of code, and show one example with a sample list and the resulting output.",
    overEngineeredPrompt: "Provide a formal category-theoretic explanation of functional filtering, implement it in 5 languages with benchmarks, and include a peer-reviewed citation list, just to filter even numbers.",
    weakOutput: "A confusing mix of multi-language code and an unrelated essay, burying the actual one-line answer.",
    optimizedOutput: "numbers = [1, 2, 3, 4, 5, 6]\nevens = [n for n in numbers if n % 2 == 0]\n# evens -> [2, 4, 6]",
    principle: "Focus Principle: Strip out requests that don't serve the core goal. A single-line task should get a single-line, focused prompt."
  },
  {
    id: "s6",
    type: "choose",
    goal: "Get AI to explain the difference between '==' and '===' in JavaScript",
    desiredOutput: "A clear, concise explanation of loose vs strict equality with one short example showing where they differ.",
    options: [
      { text: "what's the diff", correct:false, why:"Too casual and vague — doesn't specify the language or what 'diff' refers to." },
      { text: "In JavaScript, explain the difference between == (loose equality) and === (strict equality). Include one short example where they produce different results.", correct:true, why:"Specifies the language, exact operators, and asks for a concrete differentiating example." },
      { text: "Write a complete academic paper comparing equality operators across all programming languages ever created, with citations, historical context, and a philosophical discussion of the concept of 'sameness'.", correct:false, why:"Wildly over-scoped for a simple beginner question." }
    ],
    weakPrompt: "what's the diff",
    optimizedPrompt: "In JavaScript, explain the difference between == (loose equality) and === (strict equality). Include one short example where they produce different results.",
    overEngineeredPrompt: "Write a complete academic paper comparing equality operators across all programming languages ever created, with citations, historical context, and a philosophical discussion of the concept of 'sameness'.",
    weakOutput: "Different what? Could you clarify what you're comparing?",
    optimizedOutput: "== checks value equality after converting types if needed (loose). === checks both value and type without conversion (strict).\nExample: '5' == 5 -> true, but '5' === 5 -> false.",
    principle: "Precision Principle: Name the exact language and symbols you mean. Ambiguous shorthand forces the model to guess context."
  }
];

/* =========================================================
   STATE
   ========================================================= */
let state = null;

function freshState(){
  const shuffled = shuffle([...SCENARIOS]).slice(0, 6);
  return {
    scenarios: shuffled,
    current: 0,
    startTime: Date.now(),
    scenarioStartTime: Date.now(),
    totalScore: 0,
    moves: 0,
    wrongPlacements: 0,
    hintsUsed: 0,
    correctFirstTry: 0,
    scenarioResults: [], // {correct, timeTaken, hintsUsed, optimizationBonus}
    // per-scenario runtime
    build: { placed: [], pool: [], hintShown:false, submitted:false },
    clean: { kept: {}, hintShown:false, submitted:false },
    choose: { selected:null, hintShown:false, submitted:false }
  };
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* =========================================================
   TOASTS & SCORE POPUPS
   ========================================================= */
function toast(msg, kind){
  kind = kind || "info";
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

function scorePop(delta, x, y){
  const el = document.createElement("div");
  el.className = "score-pop";
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.color = delta >= 0 ? "#7dffb0" : "#ff9e9e";
  el.textContent = (delta>=0?"+":"") + delta;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1150);
}

/* =========================================================
   RENDER ROOT
   ========================================================= */
function render(){
  const app = document.getElementById("app");
  if(!state){
    app.innerHTML = renderSetup();
    bindSetup();
    return;
  }
  if(state.current >= state.scenarios.length){
    app.innerHTML = renderReport();
    bindReport();
    return;
  }
  app.innerHTML = renderHeader() + renderProgress() + renderScenario();
  bindScenario();
}

function renderHeader(){

    </div>
  </div>`;
}

function renderProgress(){

  const elapsed = Math.round((Date.now()-state.startTime)/1000);
  return `

/* =========================================================
   SETUP SCREEN (domain/difficulty already chosen via chat,
   this is the in-app "Start" confirmation screen)
   ========================================================= */
function renderSetup(){

  <div class="setup-card glass">
    <h2>Ready to sharpen your prompting skills?</h2>
    <p>Domain: <strong>${DOMAIN}</strong> &nbsp;•&nbsp; Difficulty: <strong>${DIFFICULTY}</strong></p>
    <p style="max-width:520px; margin:0 auto 18px; font-size:.88rem;">
      You'll face 6 randomized scenarios across three challenge types:
      <strong>Build the Prompt</strong>, <strong>Clean the Prompt</strong>, and <strong>Choose the Best Prompt</strong>.
      Score points for accuracy, speed, and clean optimization — avoid wrong placements and hints for bonus points!

}
function bindSetup(){

/* =========================================================
   SCENARIO RENDER — dispatch by type
   ========================================================= */
function currentScenario(){ return state.scenarios[state.current]; }

function renderScenario(){
  const sc = currentScenario();
  const typeLabel = { build:"🧱 Build the Prompt", clean:"🧹 Clean the Prompt", choose:"✅ Choose the Best Prompt" }[sc.type];
  let body = "";
  if(sc.type === "build") body = renderBuild(sc);
  else if(sc.type === "clean") body = renderClean(sc);
  else if(sc.type === "choose") body = renderChoose(sc);

  return `

    <span class="scenario-tag">${typeLabel}</span>

/* ---------- BUILD THE PROMPT ---------- */
function renderBuild(sc){
  if(!state.build.pool.length && !state.build.placed.length && !state.build._init){
    state.build = {
      placed: [],
      pool: shuffle([...sc.correctBlocks, ...sc.distractorBlocks]).map((t,i)=>({id:"b"+i, text:t, correct: sc.correctBlocks.includes(t)})),
      hintShown:false,
      submitted:false,
      _init:true
    };
  }
  const poolHtml = state.build.pool.map(b=>`
    <div class="block" draggable="true" data-id="${b.id}" data-zone="pool">${escapeHtml(b.text)}</div>
  `).join("");
  const placedHtml = state.build.placed.map(b=>`
    <div class="block locked" data-id="${b.id}" data-zone="placed">${escapeHtml(b.text)} <span class="rm" data-id="${b.id}">✕</span></div>
  `).join("");

  return `
  <div class="blocks-zone-label">Available blocks (drag into the prompt zone below)</div>
  <div class="blocks-zone" id="poolZone">${poolHtml || '<span style="color:var(--textDim); font-size:.8rem;">All blocks placed</span>'}</div>
  <div class="blocks-zone-label">Your Prompt</div>
  <div class="blocks-zone" id="placedZone">${placedHtml || '<span style="color:var(--textDim); font-size:.8rem;">Drop blocks here to build your prompt</span>'}</div>
  <div class="action-row">
    <button class="btn" id="submitBuild" ${state.build.submitted?"disabled":""}>✅ Submit Prompt</button>
    <button class="btn secondary hint-btn" id="hintBuild">💡 Hint ${state.build.hintShown?'<span class="hint-badge">used</span>':''}</button>
    <button class="btn ghost" id="resetBuild">↺ Reset</button>
  </div>`;
}

/* ---------- CLEAN THE PROMPT ---------- */
function renderClean(sc){
  if(state.clean.kept === undefined || state.clean._sc !== sc.id){
    const kept = {};
    sc.promptParts.forEach((p,i)=>kept[i]=false);
    state.clean = { kept, hintShown:false, submitted:false, _sc: sc.id };
  }
  const items = sc.promptParts.map((p,i)=>`
    <div class="clean-item ${state.clean.kept[i]?'kept':''}" data-idx="${i}">
      <div class="chk">${state.clean.kept[i]?'✓':''}</div>
      <div>${escapeHtml(p.text)}</div>
    </div>
  `).join("");
  return `
  <div class="scenario-desc">Below is a messy, unrefined prompt broken into parts. <strong>Click to keep</strong> only the parts that belong in a clean, effective prompt.</div>
  <div class="clean-list" id="cleanList">${items}</div>
  <div class="action-row">
    <button class="btn" id="submitClean" ${state.clean.submitted?"disabled":""}>✅ Submit Selection</button>
    <button class="btn secondary hint-btn" id="hintClean">💡 Hint ${state.clean.hintShown?'<span class="hint-badge">used</span>':''}</button>
    <button class="btn ghost" id="resetClean">↺ Reset</button>
  </div>`;
}

/* ---------- CHOOSE THE BEST PROMPT ---------- */
function renderChoose(sc){
  if(state.choose._sc !== sc.id){
    state.choose = { selected:null, hintShown:false, submitted:false, order: shuffle(sc.options.map((o,i)=>i)), _sc: sc.id };
  }
  const opts = state.choose.order.map(i=>{
    const o = sc.options[i];
    let cls = "choice-option";
    if(state.choose.submitted){
      if(o.correct) cls += " reveal-correct";
      if(state.choose.selected===i && !o.correct) cls += " selected-wrong";
      if(state.choose.selected===i && o.correct) cls += " selected-correct";
    }
    return `<div class="${cls}" data-idx="${i}">${escapeHtml(o.text)}${state.choose.submitted?`<small>${escapeHtml(o.why)}</small>`:""}</div>`;
  }).join("");
  return `
  <div class="scenario-desc">Pick the prompt most likely to produce the desired output.</div>
  <div id="choiceList">${opts}</div>
  <div class="action-row">
    <button class="btn" id="submitChoose" ${state.choose.submitted || state.choose.selected===null ?"disabled":""}>✅ Confirm Choice</button>
    <button class="btn secondary hint-btn" id="hintChoose">💡 Hint ${state.choose.hintShown?'<span class="hint-badge">used</span>':''}</button>
  </div>`;
}

/* =========================================================
   BIND EVENTS
   ========================================================= */
function bindScenario(){
  const sc = currentScenario();
  if(sc.type==="build") bindBuild(sc);
  else if(sc.type==="clean") bindClean(sc);
  else if(sc.type==="choose") bindChoose(sc);
}

/* ---- Build bindings (drag & drop + click fallback) ---- */
function bindBuild(sc){
  const poolZone = document.getElementById("poolZone");
  const placedZone = document.getElementById("placedZone");

  function attachDrag(el){
    el.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain", el.dataset.id);
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", ()=> el.classList.remove("dragging"));
    // click fallback (mobile / simplicity): click pool block -> moves to placed
    if(el.dataset.zone === "pool"){
      el.addEventListener("click", ()=> moveToPlaced(el.dataset.id, sc));
    }
  }
  poolZone.querySelectorAll(".block").forEach(attachDrag);
  placedZone.querySelectorAll(".block").forEach(el=>{
    el.querySelector(".rm") && el.querySelector(".rm").addEventListener("click",(e)=>{
      e.stopPropagation();
      moveToPool(el.dataset.id, sc);
    });
  });

  [poolZone, placedZone].forEach(zone=>{
    zone.addEventListener("dragover", e=>{ e.preventDefault(); zone.classList.add("dragover"); });
    zone.addEventListener("dragleave", ()=> zone.classList.remove("dragover"));
    zone.addEventListener("drop", e=>{
      e.preventDefault();
      zone.classList.remove("dragover");
      const id = e.dataTransfer.getData("text/plain");
      if(zone === placedZone) moveToPlaced(id, sc);
      else moveToPool(id, sc);
    });
  });

  const submitBtn = document.getElementById("submitBuild");
  if(submitBtn) submitBtn.onclick = ()=> submitBuild(sc);
  const hintBtn = document.getElementById("hintBuild");
  if(hintBtn) hintBtn.onclick = ()=> showHintBuild(sc);
  const resetBtn = document.getElementById("resetBuild");
  if(resetBtn) resetBtn.onclick = ()=>{ state.build._init=false; state.build={placed:[],pool:[],hintShown:false,submitted:false}; render(); };
}

function moveToPlaced(id, sc){
  if(state.build.submitted) return;
  const idx = state.build.pool.findIndex(b=>b.id===id);
  if(idx===-1) return;
  const [item] = state.build.pool.splice(idx,1);
  state.build.placed.push(item);
  state.moves++;
  if(!item.correct){
    state.wrongPlacements++;
    toast("That block doesn't belong in an optimal prompt.", "bad");
  } else {
    toast("Good block!", "good");
  }
  render();
}
function moveToPool(id, sc){
  if(state.build.submitted) return;
  const idx = state.build.placed.findIndex(b=>b.id===id);
  if(idx===-1) return;
  const [item] = state.build.placed.splice(idx,1);
  state.build.pool.push(item);
  state.moves++;
  render();
}
function showHintBuild(sc){
  if(state.build.hintShown) return;
  state.build.hintShown = true;
  state.hintsUsed++;
  toast("💡 Hint: " + sc.principle, "info");
  render();
}
function submitBuild(sc){
  if(state.build.submitted) return;
  state.build.submitted = true;
  const placedTexts = state.build.placed.map(b=>b.text);
  const correctCount = sc.correctBlocks.filter(t=>placedTexts.includes(t)).length;
  const hasDistractor = state.build.placed.some(b=>!b.correct);
  const accuracy = correctCount / sc.correctBlocks.length;
  const perfect = accuracy===1 && !hasDistractor;
  finishScenario({
    correct: perfect,
    partialAccuracy: accuracy,
    hintsUsed: state.build.hintShown?1:0,
    wrongInThis: state.build.placed.filter(b=>!b.correct).length
  }, sc, buildFeedbackHtml(sc, perfect, accuracy));
}
function buildFeedbackHtml(sc, perfect, accuracy){
  return `
    <div class="feedback-box ${perfect?'good':'bad'}">
      ${perfect ? "✅ Perfect! You assembled an optimal prompt." : `⚠️ You captured ${Math.round(accuracy*100)}% of the essential blocks${state.build.placed.some(b=>!b.correct)?", and included distractor(s)." : "."}`}
      <div class="compare-grid">
        <div class="compare-box weak"><h4>Weak Prompt</h4><p>${escapeHtml(sc.weakPrompt)}</p></div>
        <div class="compare-box optimized"><h4>Optimized Prompt</h4><p>${escapeHtml(sc.optimizedPrompt)}</p></div>
      </div>
      <p style="margin-top:10px;"><strong>Prompt Principle:</strong> ${sc.principle}</p>
    </div>`;
}

/* ---- Clean bindings ---- */
function bindClean(sc){
  document.querySelectorAll("#cleanList .clean-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(state.clean.submitted) return;
      const idx = el.dataset.idx;
      state.clean.kept[idx] = !state.clean.kept[idx];
      state.moves++;
      render();
    });
  });
  const submitBtn = document.getElementById("submitClean");
  if(submitBtn) submitBtn.onclick = ()=> submitClean(sc);
  const hintBtn = document.getElementById("hintClean");
  if(hintBtn) hintBtn.onclick = ()=>{
    if(state.clean.hintShown) return;
    state.clean.hintShown = true;
    state.hintsUsed++;
    toast("💡 Hint: " + sc.principle, "info");
    render();
  };
  const resetBtn = document.getElementById("resetClean");
  if(resetBtn) resetBtn.onclick = ()=>{ state.clean._sc = null; render(); };
}
function submitClean(sc){
  if(state.clean.submitted) return;
  state.clean.submitted = true;
  let correctChoices = 0, wrongChoices = 0;
  sc.promptParts.forEach((p,i)=>{
    const kept = !!state.clean.kept[i];
    if(kept === p.keep) correctChoices++;
    else wrongChoices++;
  });
  const accuracy = correctChoices / sc.promptParts.length;
  const perfect = wrongChoices===0;
  finishScenario({
    correct: perfect,
    partialAccuracy: accuracy,
    hintsUsed: state.clean.hintShown?1:0,
    wrongInThis: wrongChoices
  }, sc, cleanFeedbackHtml(sc, perfect, accuracy));
}
function cleanFeedbackHtml(sc, perfect, accuracy){
  return `
    <div class="feedback-box ${perfect?'good':'bad'}">
      ${perfect ? "✅ Perfect cleanup! You kept exactly the essential parts." : `⚠️ ${Math.round(accuracy*100)}% correct selections — some noise was kept or useful parts were removed.`}
      <div class="compare-grid">
        <div class="compare-box weak"><h4>Messy Prompt</h4><p>${escapeHtml(sc.weakPrompt)}</p></div>
        <div class="compare-box optimized"><h4>Cleaned Prompt</h4><p>${escapeHtml(sc.optimizedPrompt)}</p></div>
      </div>
      <p style="margin-top:10px;"><strong>Prompt Principle:</strong> ${sc.principle}</p>
    </div>`;
}

/* ---- Choose bindings ---- */
function bindChoose(sc){
  document.querySelectorAll("#choiceList .choice-option").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(state.choose.submitted) return;
      state.choose.selected = parseInt(el.dataset.idx,10);
      state.moves++;
      render();
    });
  });
  const submitBtn = document.getElementById("submitChoose");
  if(submitBtn) submitBtn.onclick = ()=> submitChoose(sc);
  const hintBtn = document.getElementById("hintChoose");
  if(hintBtn) hintBtn.onclick = ()=>{
    if(state.choose.hintShown) return;
    state.choose.hintShown = true;
    state.hintsUsed++;
    toast("💡 Hint: " + sc.principle, "info");
    render();
  };
}
function submitChoose(sc){
  if(state.choose.submitted || state.choose.selected===null) return;
  state.choose.submitted = true;
  const chosen = sc.options[state.choose.selected];
  const correct = !!chosen.correct;
  if(!correct) state.wrongPlacements++;
  finishScenario({
    correct,
    partialAccuracy: correct?1:0,
    hintsUsed: state.choose.hintShown?1:0,
    wrongInThis: correct?0:1
  }, sc, chooseFeedbackHtml(sc, correct));
}
function chooseFeedbackHtml(sc, correct){
  return `
    <div class="feedback-box ${correct?'good':'bad'}">
      ${correct ? "✅ Correct! That's the most effective prompt." : "❌ Not quite the best choice — see the highlighted correct option above."}
      <div class="compare-grid">
        <div class="compare-box weak"><h4>Weak Output</h4><p>${escapeHtml(sc.weakOutput)}</p></div>
        <div class="compare-box optimized"><h4>Optimized Output</h4><p>${escapeHtml(sc.optimizedOutput)}</p></div>
      </div>
      <p style="margin-top:10px;"><strong>Prompt Principle:</strong> ${sc.principle}</p>
    </div>`;
}

/* =========================================================
   FINISH SCENARIO -> scoring -> show feedback -> next
   ========================================================= */
function finishScenario(result, sc, feedbackHtml){
  const timeTaken = (Date.now() - state.scenarioStartTime)/1000;
  const timeBonus = Math.max(0, Math.round(30 - timeTaken)); // faster = more bonus, capped floor 0
  const accuracyPoints = Math.round(result.partialAccuracy * 100);
  const hintPenalty = result.hintsUsed * 15;
  const wrongPenalty = result.wrongInThis * 10;
  const optimizationBonus = result.correct ? 25 : 0;
  let scenarioScore = accuracyPoints + timeBonus + optimizationBonus - hintPenalty - wrongPenalty;
  scenarioScore = Math.max(0, scenarioScore);

  state.totalScore += scenarioScore;
  if(result.correct) state.correctFirstTry++;
  state.scenarioResults.push({
    id: sc.id, type: sc.type, correct: result.correct, accuracy: result.partialAccuracy,
    timeTaken: Math.round(timeTaken), hintsUsed: result.hintsUsed, wrongInThis: result.wrongInThis,
    scenarioScore, optimizationBonus
  });

  // render feedback + next button
  const feedbackArea = document.getElementById("feedbackArea");
  if(feedbackArea){
    feedbackArea.innerHTML = feedbackHtml + `
      <div class="action-row">
        <span class="stat-chip" style="font-weight:700; color:var(--good);">+${scenarioScore} pts</span>
        <button class="btn" id="nextBtn">${state.current+1 < state.scenarios.length ? "Next Scenario ➡️" : "See Final Report 📊"}</button>
      </div>`;
    document.getElementById("nextBtn").onclick = ()=>{
      state.current++;
      state.scenarioStartTime = Date.now();
      state.build = { placed: [], pool: [], hintShown:false, submitted:false };
      state.clean = { kept: {}, hintShown:false, submitted:false, _sc:null };
      state.choose = { selected:null, hintShown:false, submitted:false, _sc:null };
      render();
    };
  }

  // toast + score pop near top
  toast(result.correct ? "Scenario complete! Great work." : "Scenario complete — review the feedback.", result.correct?"good":"info");
  const rect = document.querySelector(".scenario-card").getBoundingClientRect();
  scorePop(scenarioScore, rect.left + rect.width/2, rect.top + window.scrollY + 20);

  // disable further interaction visually is handled by submitted flags
}

/* =========================================================
   FINAL REPORT
   ========================================================= */
function computeReport(){
  const results = state.scenarioResults;
  const n = results.length || 1;
  const avgAccuracy = results.reduce((a,r)=>a+r.accuracy,0)/n;
  const totalTime = Math.round((Date.now()-state.startTime)/1000);
  const totalHints = state.hintsUsed;
  const totalWrong = state.wrongPlacements;
  const perfectCount = results.filter(r=>r.correct).length;

  let rating, rank;
  const pct = avgAccuracy*100;
  if(pct>=90 && totalHints<=1){ rating="Outstanding"; rank="🏆 Prompt Grandmaster"; }
  else if(pct>=75){ rating="Excellent"; rank="🥇 Prompt Pro"; }
  else if(pct>=55){ rating="Good"; rank="🥈 Prompt Apprentice"; }
  else { rating="Developing"; rank="🥉 Prompt Novice"; }

  // Prompt DNA dimensions (0-100)
  const dna = {
    "Specificity": clampPct(avgAccuracy*100 - totalWrong*3),
    "Clarity": clampPct(100 - totalWrong*8),
    "Efficiency": clampPct(100 - Math.round(totalTime/n)),
    "Structure": clampPct((perfectCount/n)*100),
    "Optimization": clampPct(results.reduce((a,r)=>a+r.optimizationBonus,0)/n*4)
  };

  const finalScenario = state.scenarios[state.scenarios.length-1];
  return { avgAccuracy, totalTime, totalHints, totalWrong, perfectCount, rating, rank, dna, finalScenario, n };
}
function clampPct(v){ return Math.max(5, Math.min(100, Math.round(v))); }

function renderReport(){
  const r = computeReport();
  const dnaRows = Object.entries(r.dna).map(([k,v])=>`
    <div class="dna-bar-row">
      <div class="dna-label">${k}</div>
      <div class="dna-track"><div class="dna-fill" style="width:${v}%;"></div></div>
      <div class="dna-val">${v}%</div>
    </div>`).join("");

  let feedback;
  if(r.rating==="Outstanding") feedback = "You consistently identify the essential elements of a prompt — specificity, context, and scope — with minimal wasted moves. You're ready to tackle advanced, multi-step prompt engineering tasks.";
  else if(r.rating==="Excellent") feedback = "Strong instinct for what makes prompts effective. Tighten up on avoiding unnecessary hints and double-check for stray distractor instructions to push into mastery territory.";
  else if(r.rating==="Good") feedback = "You're grasping the core principles, but accuracy dipped in a few scenarios. Focus on reading the 'Desired Output' carefully before selecting or building blocks.";
  else feedback = "You're building the foundation. Revisit the Prompt Principles shown after each scenario — especially around specificity and removing irrelevant instructions — and try again to reinforce the pattern.";

  let milestone;
  if(r.rating==="Outstanding") milestone = "Next milestone: Try the Advanced or Expert difficulty to practice multi-constraint, ambiguous real-world prompting scenarios.";
  else if(r.rating==="Excellent") milestone = "Next milestone: Aim for a perfect run with zero hints used to unlock Prompt Grandmaster rank.";
  else if(r.rating==="Good") milestone = "Next milestone: Reduce wrong placements below 3 per session by re-reading each Desired Output twice before acting.";
  else milestone = "Next milestone: Complete a full session with at least 60% accuracy without using more than 2 hints.";

  return `
  ${renderHeader()}
  <div class="report-card glass">
    <div class="report-hero">
      <div class="report-score">${state.totalScore}</div>
      <div class="report-rating">Prompt Score</div>
      <div class="report-rank">${r.rank}</div>
      <div class="report-rating">${r.rating} Performance</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-box"><div class="val">${Math.round(r.avgAccuracy*100)}%</div><div class="lbl">Accuracy</div></div>
      <div class="metric-box"><div class="val">${r.totalTime}s</div><div class="lbl">Total Time</div></div>
      <div class="metric-box"><div class="val">${state.moves}</div><div class="lbl">Moves</div></div>
      <div class="metric-box"><div class="val">${r.totalWrong}</div><div class="lbl">Wrong Placements</div></div>
      <div class="metric-box"><div class="val">${r.totalHints}</div><div class="lbl">Hints Used</div></div>
      <div class="metric-box"><div class="val">${r.perfectCount}/${r.n}</div><div class="lbl">Perfect Scenarios</div></div>
    </div>

    <div class="dna-wrap">
      <div class="dna-title">🧬 Prompt DNA</div>
      ${dnaRows}
    </div>

    <div class="feedback-block">
      <strong>📋 Personalized Feedback</strong><br>${feedback}
    </div>
    <div class="milestone-block">
      <strong>🚩 Next Milestone</strong><br>${milestone}
    </div>

    <div class="dna-title" style="margin-top:6px;">✨ Final Optimized Prompt Example</div>
    <div class="final-prompt-block">${escapeHtml(r.finalScenario.optimizedPrompt)}</div>

    <div class="action-row" style="justify-content:center; margin-top:24px;">
      <button class="btn" id="replayBtn">🔁 Replay with New Scenarios</button>
    </div>
  </div>
  <footer>🧩 Prompt Puzzle — works fully offline. Domain: ${DOMAIN} · Difficulty: ${DIFFICULTY}</footer>
  `;
}
function bindReport(){
  document.getElementById("replayBtn").onclick = ()=>{
    state = freshState();
    render();
    toast("New scenarios loaded — good luck!", "info");
  };
  // animate DNA bars in (already width set via CSS transition on next frame)
}

/* =========================================================
   UTIL
   ========================================================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

/* =========================================================
   INIT
   ========================================================= */
render();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supply Chain Builder</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg-0:#0a0e17;
    --bg-1:#0f1420;
    --bg-2:#151b2b;
    --bg-3:#1c2438;
    --border:#2a3350;
    --border-light:#3a4568;
    --text-0:#f2f4fa;
    --text-1:#b9c2dd;
    --text-2:#7c88ab;
    --accent:#5b8cff;
    --accent-2:#7ee0c2;
    --accent-3:#ffb454;
    --danger:#ff6b6b;
    --success:#4ade80;
    --warn:#ffcc66;
    --shadow: 0 10px 40px rgba(0,0,0,0.45);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 10% 0%, #131a2c 0%, #0a0e17 55%), var(--bg-0);
    color: var(--text-0);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}

  .app-shell{
    max-width:1200px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:1.1rem;
    letter-spacing:0.3px;
  }
  .brand-dot{
    width:12px;height:12px;border-radius:50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 14px rgba(91,140,255,0.7);
  }
  .step-pill{
    font-size:0.78rem;
    color:var(--text-2);
    background:var(--bg-2);
    border:1px solid var(--border);
    padding:6px 14px;
    border-radius:999px;
  }

  .card{
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  h1{ font-size:2rem; margin:0 0 10px; letter-spacing:-0.5px; }
  h2{ font-size:1.5rem; margin:0 0 8px; letter-spacing:-0.3px; }
  h3{ font-size:1.15rem; margin:0 0 6px; }
  p{ line-height:1.6; color:var(--text-1); margin:0 0 14px; }
  .muted{ color:var(--text-2); font-size:0.9rem; }

  .btn{
    background: linear-gradient(135deg, var(--accent), #7aa2ff);
    color:#0a0e17;
    border:none;
    padding:13px 26px;
    border-radius:12px;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    box-shadow:0 6px 18px rgba(91,140,255,0.35);
  }
  .btn:hover{ transform:translateY(-2px); filter:brightness(1.08); box-shadow:0 10px 24px rgba(91,140,255,0.45); }
  .btn:active{ transform:translateY(0px) scale(0.98); }

  .btn-secondary{
    background: transparent;
    color:var(--text-0);
    border:1px solid var(--border-light);
    box-shadow:none;
  }
  .btn-secondary:hover{ background:var(--bg-3); box-shadow:none; }

  .btn-ghost{
    background:transparent;
    color:var(--text-2);
    border:1px solid var(--border);
  }
  .btn-ghost:hover{ color:var(--text-0); border-color:var(--border-light); }

  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }

  .grid{
    display:grid;
    gap:18px;
  }
  .grid-2{ grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); }
  .grid-3{ grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); }
  .grid-4{ grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); }

  .option-card{
    background:var(--bg-3);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:20px;
    cursor:pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    position:relative;
    overflow:hidden;
  }
  .option-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    background:#212a44;
  }
  .option-card.selected{
    border-color:var(--accent-2);
    background: linear-gradient(180deg, rgba(126,224,194,0.12), rgba(126,224,194,0.02));
    box-shadow:0 0 0 1px rgba(126,224,194,0.4), 0 8px 24px rgba(126,224,194,0.15);
  }
  .option-icon{ font-size:1.8rem; margin-bottom:8px; display:block; }
  .option-title{ font-weight:700; font-size:1.02rem; margin-bottom:4px; color:var(--text-0); }
  .option-desc{ font-size:0.85rem; color:var(--text-2); line-height:1.5; }

  .badge{
    display:inline-block;
    font-size:0.7rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    letter-spacing:0.4px;
    text-transform:uppercase;
  }
  .badge-cost{ background:rgba(255,180,84,0.15); color:var(--accent-3); }
  .badge-speed{ background:rgba(91,140,255,0.15); color:var(--accent); }
  .badge-risk{ background:rgba(255,107,107,0.15); color:var(--danger); }
  .badge-good{ background:rgba(74,222,128,0.15); color:var(--success); }

  .explain-box{
    background:rgba(91,140,255,0.08);
    border:1px solid rgba(91,140,255,0.25);
    border-left:4px solid var(--accent);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:22px;
    font-size:0.92rem;
    color:var(--text-1);
    line-height:1.6;
  }
  .explain-box b{ color:var(--text-0); }

  .feedback-box{
    background:rgba(126,224,194,0.08);
    border:1px solid rgba(126,224,194,0.3);
    border-left:4px solid var(--accent-2);
    border-radius:12px;
    padding:16px 18px;
    margin-top:18px;
    font-size:0.9rem;
    color:var(--text-1);
    line-height:1.6;
    animation: fadeUp 0.4s ease;
  }

  /* metrics */
  .metrics-panel{
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    position:sticky;
    top:20px;
  }
  .metric-row{ margin-bottom:16px; }
  .metric-label{
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.85rem; color:var(--text-1); margin-bottom:6px;
  }
  .metric-label b{ color:var(--text-0); font-size:0.9rem; }
  .metric-track{
    background:var(--bg-0);
    border:1px solid var(--border);
    border-radius:999px;
    height:10px;
    overflow:hidden;
  }
  .metric-fill{
    height:100%;
    border-radius:999px;
    transition: width 0.7s cubic-bezier(.4,0,.2,1);
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .metric-fill.risk{ background: linear-gradient(90deg, #ffcc66, var(--danger)); }
  .metric-fill.cost{ background: linear-gradient(90deg, #ffd98a, var(--accent-3)); }
  .metric-fill.sustain{ background: linear-gradient(90deg, #4ade80, var(--accent-2)); }

  .company-card{
    display:flex;
    gap:18px;
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .company-chip{
    background:var(--bg-3);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:12px;
    font-size:0.85rem;
    color:var(--text-1);
  }
  .company-chip b{ color:var(--text-0); }

  .layout{
    display:grid;
    grid-template-columns: 1fr 320px;
    gap:22px;
    align-items:start;
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; }
    .metrics-panel{ position:static; }
  }

  .score-ring{
    width:180px; height:180px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin:0 auto 20px;
    background: conic-gradient(var(--accent-2) calc(var(--pct) * 1%), var(--bg-3) 0);
    transition: background 1s ease;
  }
  .score-ring::before{
    content:'';
    position:absolute;
    width:140px;height:140px;
    border-radius:50%;
    background:var(--bg-1);
    border:1px solid var(--border);
  }
  .score-ring-value{
    position:relative;
    z-index:2;
    text-align:center;
  }
  .score-ring-value .num{ font-size:2.4rem; font-weight:800; }
  .score-ring-value .lbl{ font-size:0.75rem; color:var(--text-2); text-transform:uppercase; letter-spacing:1px; }

  .list-check{ list-style:none; padding:0; margin:0; }
  .list-check li{
    padding:10px 0;
    border-bottom:1px solid var(--border);
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:0.92rem;
    color:var(--text-1);
    line-height:1.5;
  }
  .list-check li:last-child{ border-bottom:none; }
  .list-check .ico{ flex-shrink:0; font-size:1.05rem; margin-top:1px; }

  .summary-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap:16px;
    margin-top:22px;
  }
  .summary-card{
    background:var(--bg-3);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
  }
  .summary-card h4{
    margin:0 0 10px;
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--text-2);
  }

  .progress-header{
    display:flex;
    gap:8px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .progress-step{
    flex:1;
    min-width:60px;
    height:6px;
    border-radius:999px;
    background:var(--bg-3);
    overflow:hidden;
  }
  .progress-step.done .inner{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); width:100%; }
  .progress-step.active .inner{ background: linear-gradient(90deg, var(--accent), var(--accent-2)); width:100%; animation:pulse 1.4s infinite; }
  .progress-step .inner{ height:100%; width:0%; transition:width 0.4s ease; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.5;} }

  .risk-callout{
    background:rgba(255,107,107,0.08);
    border:1px solid rgba(255,107,107,0.3);
    border-left:4px solid var(--danger);
    border-radius:12px;
    padding:16px 18px;
    margin-top:18px;
    font-size:0.92rem;
    color:var(--text-1);
    line-height:1.6;
  }

  .glossary-toggle{
    font-size:0.8rem;
    color:var(--accent);
    cursor:pointer;
    text-decoration:underline;
    margin-bottom:10px;
    display:inline-block;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:var(--bg-0); }
  ::-webkit-scrollbar-thumb{ background:var(--border-light); border-radius:8px; }

  .footer-note{
    text-align:center;
    color:var(--text-2);
    font-size:0.8rem;
    margin-top:36px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ============================================================
   DATA POOLS FOR RANDOM COMPANY GENERATION
   ============================================================ */

const INDUSTRIES = [
  { name: "Sportswear", icon: "👟", products: ["running shoes", "athletic jackets", "gym bags"] },
  { name: "Consumer Electronics", icon: "🔌", products: ["wireless earbuds", "smart watches", "power banks"] },
  { name: "Organic Foods", icon: "🥑", products: ["snack bars", "cold-pressed juices", "granola packs"] },
  { name: "Furniture", icon: "🪑", products: ["flat-pack chairs", "wooden desks", "modular shelves"] },
  { name: "Cosmetics", icon: "💄", products: ["skincare serums", "lipsticks", "face masks"] },
  { name: "Toys", icon: "🧸", products: ["building blocks", "plush toys", "puzzle sets"] },
  { name: "Home Appliances", icon: "🧺", products: ["air fryers", "vacuum cleaners", "coffee makers"] },
  { name: "Outdoor Gear", icon: "🏕️", products: ["hiking backpacks", "camping tents", "water bottles"] },
];

const COUNTRY_GROUPS = [
  ["USA", "Canada", "Mexico"],
  ["Germany", "France", "Italy", "Spain"],
  ["India", "Japan", "South Korea"],
  ["Brazil", "Argentina", "Chile"],
  ["UK", "Netherlands", "Sweden"],
  ["Australia", "New Zealand"],
  ["UAE", "Saudi Arabia", "Egypt"],
];

const DEMAND_LEVELS = [
  { level: "Low", desc: "Steady, predictable demand with few surprises.", mult: 0.8 },
  { level: "Moderate", desc: "Demand fluctuates with seasons and trends.", mult: 1.0 },
  { level: "High", desc: "Fast-growing demand — customers expect quick delivery.", mult: 1.3 },
  { level: "Volatile", desc: "Demand spikes unpredictably — hard to forecast.", mult: 1.5 },
];

function randomFrom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function generateCompany(){
  const industry = randomFrom(INDUSTRIES);
  const countries = randomFrom(COUNTRY_GROUPS);
  const demand = randomFrom(DEMAND_LEVELS);
  const namePrefixes = ["Nova", "Vertex", "Summit", "Cobalt", "Lumen", "Orbit", "Atlas", "Northfield", "Cedar", "Pioneer"];
  const nameSuffixes = ["Goods", "Co.", "Industries", "Supply Co.", "Global", "& Sons", "Works", "Group"];
  const companyName = `${randomFrom(namePrefixes)} ${randomFrom(nameSuffixes)}`;
  const products = industry.products;
  return { companyName, industry, countries, demand, products };
}

/* ============================================================
   DECISION DATA — each choice affects metrics
   Metrics scale roughly 0-100: cost (lower=better shown inverted),
   speed, risk (lower=better), satisfaction, sustainability
   ============================================================ */

const SUPPLIER_OPTIONS = [
  {
    id: "single",
    icon: "🎯",
    title: "Single Supplier",
    desc: "Rely on one trusted supplier for all materials.",
    explain: "A single supplier means you build a close relationship and may get better prices through bulk deals. It's simple to manage. But if that one supplier has a problem — a factory fire, a strike, a shipping delay — your entire production line can stop. This is called 'supplier concentration risk.'",
    effects: { cost: +12, speed: +6, risk: -18, satisfaction: 0, sustainability: +4 },
  },
  {
    id: "multiple",
    icon: "🕸️",
    title: "Multiple Suppliers",
    desc: "Spread sourcing across several suppliers.",
    explain: "Using multiple suppliers protects you: if one fails, others can cover the gap. This is called 'supplier diversification.' The trade-off is that it's more complex to coordinate, and you lose some bulk-discount pricing power since your orders are split up.",
    effects: { cost: -8, speed: -4, risk: +16, satisfaction: +2, sustainability: -3 },
  },
];

const FACTORY_OPTIONS = [
  {
    id: "domestic",
    icon: "🏠",
    title: "Domestic Factory",
    desc: "Manufacture in your home market.",
    explain: "A domestic factory is close to your customers, so shipping is fast and you have full oversight of quality and labor conditions. The downside is higher labor and operating costs compared to manufacturing overseas, which raises your product cost.",
    effects: { cost: -14, speed: +18, risk: +6, satisfaction: +10, sustainability: +10 },
  },
  {
    id: "nearshore",
    icon: "🗺️",
    title: "Nearshore Factory",
    desc: "Manufacture in a nearby country.",
    explain: "Nearshoring balances cost and speed — you get somewhat lower labor costs than domestic manufacturing while keeping shipping times relatively short. It's a popular middle-ground strategy for companies that want resilience without huge shipping delays.",
    effects: { cost: 0, speed: +6, risk: +2, satisfaction: +4, sustainability: +2 },
  },
  {
    id: "offshore",
    icon: "🌏",
    title: "Offshore Factory",
    desc: "Manufacture in a distant, low-cost country.",
    explain: "Offshoring (e.g. manufacturing far from your customers) usually means much lower labor costs, so your product is cheaper to make. But shipping takes longer, customs and tariffs add complexity, and long supply lines are more exposed to global disruptions like port congestion.",
    effects: { cost: +18, speed: -16, risk: -8, satisfaction: -6, sustainability: -10 },
  },
];

const WAREHOUSE_OPTIONS = [
  {
    id: "centralized",
    icon: "🏢",
    title: "Centralized Warehouse",
    desc: "One large warehouse serving all regions.",
    explain: "A centralized warehouse is cheaper to run — one lease, one team, simpler inventory tracking. But it means every order has to travel further to reach distant customers, which slows delivery, especially for international orders.",
    effects: { cost: +14, speed: -10, risk: +2, satisfaction: -6, sustainability: -4 },
  },
  {
    id: "regional",
    icon: "🏬",
    title: "Regional Warehouses",
    desc: "Several warehouses placed near key markets.",
    explain: "Regional warehouses put your inventory closer to customers, so delivery is much faster and customers are happier. The cost is higher — you're paying rent, staff, and inventory duplication across multiple locations.",
    effects: { cost: -12, speed: +14, risk: -4, satisfaction: +12, sustainability: +2 },
  },
  {
    id: "hybrid",
    icon: "🔀",
    title: "Hybrid Network",
    desc: "One central hub plus a few regional micro-hubs.",
    explain: "A hybrid network tries to capture the best of both: a central hub keeps costs manageable for bulk storage, while small regional hubs speed up delivery for your busiest markets. It's more complex to design and manage than a single-warehouse setup.",
    effects: { cost: -2, speed: +8, risk: +2, satisfaction: +6, sustainability: 0 },
  },
];

const TRANSPORT_OPTIONS = [
  {
    id: "road",
    icon: "🚚",
    title: "Road",
    desc: "Trucks for regional delivery.",
    explain: "Road transport is flexible and works well for short-to-medium distances, with door-to-door delivery. It's usually cheaper than air but slower than rail for very long distances, and it produces significant carbon emissions per shipment on longer routes.",
    effects: { cost: -6, speed: +2, risk: 0, satisfaction: +2, sustainability: -2 },
  },
  {
    id: "rail",
    icon: "🚆",
    title: "Rail",
    desc: "Trains for large, heavy shipments.",
    explain: "Rail is very cost-efficient for large volumes over long land distances and produces far fewer emissions per unit than road or air. The downside is limited flexibility — goods still need trucks for the 'last mile,' and rail networks aren't available everywhere.",
    effects: { cost: -12, speed: -6, risk: +2, satisfaction: -2, sustainability: +14 },
  },
  {
    id: "sea",
    icon: "🚢",
    title: "Sea",
    desc: "Container ships for international bulk cargo.",
    explain: "Sea freight is by far the cheapest way to move large volumes internationally, which is why most global trade uses it. The trade-off is speed — a shipment can take weeks — and it's vulnerable to port congestion, weather, and geopolitical chokepoints like canals.",
    effects: { cost: -18, speed: -20, risk: +8, satisfaction: -10, sustainability: +6 },
  },
  {
    id: "air",
    icon: "✈️",
    title: "Air",
    desc: "Air freight for urgent, high-value goods.",
    explain: "Air freight is by far the fastest option, ideal for urgent or high-value goods and keeping customers happy. But it's the most expensive method by weight and has the largest carbon footprint, so it should usually be reserved for time-critical shipments only.",
    effects: { cost: +22, speed: +22, risk: -4, satisfaction: +10, sustainability: -16 },
  },
];

const INVENTORY_OPTIONS = [
  {
    id: "low",
    icon: "📉",
    title: "Low Inventory (Lean/JIT)",
    desc: "Keep minimal stock, order as needed.",
    explain: "Low inventory — often called 'Just-In-Time' — reduces storage costs and waste since you're not paying to hold unsold stock. The risk is that if demand suddenly spikes or a shipment is delayed, you can run out of stock and disappoint customers.",
    effects: { cost: -14, speed: -2, risk: +14, satisfaction: -8, sustainability: +8 },
  },
  {
    id: "balanced",
    icon: "⚖️",
    title: "Balanced Inventory",
    desc: "Moderate safety stock levels.",
    explain: "A balanced strategy keeps a reasonable safety buffer of stock — enough to absorb small demand swings or shipping delays without tying up too much cash in unsold goods. It's the most common approach for stable, established businesses.",
    effects: { cost: 0, speed: 0, risk: 0, satisfaction: +2, sustainability: 0 },
  },
  {
    id: "high",
    icon: "📈",
    title: "High Inventory",
    desc: "Stockpile large safety buffers.",
    explain: "High inventory levels mean you're almost always ready to fulfill orders instantly, boosting customer satisfaction and protecting against disruptions. But it ties up a lot of cash in storage, increases warehousing costs, and raises the risk of unsold goods going to waste.",
    effects: { cost: +16, speed: +6, risk: -10, satisfaction: +8, sustainability: -8 },
  },
];

/* ============================================================
   SMALL REUSABLE COMPONENTS
   ============================================================ */

function ProgressHeader({ stepIndex, totalSteps }){
  return (
    <div className="progress-header">
      {Array.from({ length: totalSteps }).map((_, i) => {
        let cls = "progress-step";
        if (i < stepIndex) cls += " done";
        else if (i === stepIndex) cls += " active";
        return (
          <div key={i} className={cls}>
            <div className="inner"></div>
          </div>
        );
      })}
    </div>
  );
}

function Metric({ label, value, suffix, type }){
  const pct = Math.max(0, Math.min(100, value));
  return (
    <div className="metric-row">
      <div className="metric-label">
        <span>{label}</span>
        <b>{Math.round(pct)}{suffix || ""}</b>
      </div>
      <div className="metric-track">
        <div
          className={"metric-fill" + (type ? " " + type : "")}
          style={{ width: pct + "%" }}
        ></div>
      </div>
    </div>
  );
}

function MetricsPanel({ metrics }){
  return (
    <div className="metrics-panel">
      <h3>📊 Live Business Metrics</h3>
      <p className="muted" style={{marginBottom:'18px'}}>These update after every decision you make.</p>
      <Metric label="💰 Cost Efficiency" value={metrics.cost} type="cost" />
      <Metric label="⚡ Delivery Speed" value={metrics.speed} />
      <Metric label="🛡️ Risk Control" value={metrics.risk} type="risk" />
      <Metric label="😊 Customer Satisfaction" value={metrics.satisfaction} />
      <Metric label="🌱 Sustainability" value={metrics.sustainability} type="sustain" />
    </div>
  );
}

function OptionCard({ opt, selected, onSelect }){
  return (
    <div
      className={"option-card" + (selected ? " selected" : "")}
      onClick={() => onSelect(opt)}
    >
      <span className="option-icon">{opt.icon}</span>
      <div className="option-title">{opt.title}</div>
      <div className="option-desc">{opt.desc}</div>
    </div>
  );
}

function CompanyCard({ company }){
  return (
    <div className="company-card">
      <div className="company-chip">🏭 <b>{company.companyName}</b></div>
      <div className="company-chip">{company.industry.icon} Industry: <b>{company.industry.name}</b></div>
      <div className="company-chip">📦 Product: <b>{company.products.join(", ")}</b></div>
      <div className="company-chip">🌍 Markets: <b>{company.countries.join(", ")}</b></div>
      <div className="company-chip">📈 Demand: <b>{company.demand.level}</b></div>
    </div>
  );
}

/* ============================================================
   SCREENS
   ============================================================ */

function WelcomeScreen({ onStart }){
  return (
    <div className="card">
      <h1>🔗 Supply Chain Builder</h1>
      <p style={{fontSize:'1.05rem'}}>
        A <b style={{color:'var(--text-0)'}}>supply chain</b> is the entire journey a product takes —
        from raw materials, to factories, to warehouses, to trucks and ships, all the way to a
        customer's doorstep. Every business, from a small bakery to a global electronics brand,
        depends on one.
      </p>
      <p>
        Every decision along this journey — who supplies your materials, where you manufacture,
        how you store goods, how you ship them, and how much stock you keep — creates trade-offs.
        Choosing "cheaper" often means "slower." Choosing "faster" often means "more expensive" or
        "riskier." There is no perfect answer — only the right balance for your business.
      </p>
      <p>
        In this simulator, you'll be handed a randomly generated company. You'll make five key
        supply chain decisions. After each one, we'll explain <i>why</i> it matters in plain
        English, and you'll watch five live business metrics — <b>Cost, Speed, Risk, Customer
        Satisfaction,</b> and <b>Sustainability</b> — shift in response. At the end, you'll get a
        full performance dashboard with a score, strengths, weaknesses, and real improvement tips.
      </p>
      <div className="btn-row">
        <button className="btn" onClick={onStart}>Start Building 🚀</button>
      </div>
    </div>
  );
}

function CompanyIntroScreen({ company, onContinue }){
  return (
    <div className="card">
      <h2>{company.industry.icon} Meet Your Company</h2>
      <p>
        You've just been hired as the new Supply Chain Manager at <b style={{color:'var(--text-0)'}}>{company.companyName}</b>,
        a company in the <b style={{color:'var(--text-0)'}}>{company.industry.name}</b> industry.
        They sell products like <b style={{color:'var(--text-0)'}}>{company.products.join(", ")}</b> across{" "}
        <b style={{color:'var(--text-0)'}}>{company.countries.join(", ")}</b>.
      </p>
      <CompanyCard company={company} />
      <div className="explain-box">
        <b>Demand Level: {company.demand.level}.</b> {company.demand.desc} This affects how much
        pressure your supply chain will be under — higher demand means more strain on speed and
        inventory, while low demand gives you more room to optimize for cost.
      </div>
      <p>
        Your job: design a supply chain across five key decisions. Every choice has real
        consequences for cost, speed, risk, customer happiness, and the environment. Let's get
        started.
      </p>
      <div className="btn-row">
        <button className="btn" onClick={onContinue}>Begin Designing My Supply Chain →</button>
      </div>
    </div>
  );
}

const STEPS_META = [
  {
    key: "supplier",
    title: "Step 1: Choose Your Supplier Strategy",
    icon: "🧵",
    lead: "Suppliers provide the raw materials or components your factory needs. This is the very first link in your supply chain.",
    options: SUPPLIER_OPTIONS,
  },
  {
    key: "factory",
    title: "Step 2: Choose Your Factory Location",
    icon: "🏭",
    lead: "Your factory is where raw materials are turned into finished products. Its location shapes your labor costs, shipping distance, and how much control you have over quality.",
    options: FACTORY_OPTIONS,
  },
  {
    key: "warehouse",
    title: "Step 3: Choose Your Warehouse Strategy",
    icon: "📦",
    lead: "Warehouses store finished goods until they're shipped to customers. Where you place them determines how quickly orders can reach different markets.",
    options: WAREHOUSE_OPTIONS,
  },
  {
    key: "transport",
    title: "Step 4: Choose Your Transportation Method",
    icon: "🚛",
    lead: "Transportation moves goods between suppliers, factories, warehouses, and customers. Different methods trade off speed, cost, and environmental impact.",
    options: TRANSPORT_OPTIONS,
  },
  {
    key: "inventory",
    title: "Step 5: Choose Your Inventory Strategy",
    icon: "🗃️",
    lead: "Inventory strategy decides how much stock you keep on hand. It's a balancing act between being ready for demand and not wasting money on unsold goods.",
    options: INVENTORY_OPTIONS,
  },
];

function DecisionScreen({ stepMeta, onChoose, choice }){
  const [localSelected, setLocalSelected] = useState(choice ? choice.id : null);
  const [confirmedOpt, setConfirmedOpt] = useState(choice || null);

  useEffect(() => {
    setLocalSelected(choice ? choice.id : null);
    setConfirmedOpt(choice || null);
  }, [stepMeta.key]);

  const handlePick = (opt) => {
    setLocalSelected(opt.id);
    setConfirmedOpt(opt);
  };

  return (
    <div className="card">
      <h2>{stepMeta.icon} {stepMeta.title}</h2>
      <p>{stepMeta.lead}</p>

      <div className={"grid " + (stepMeta.options.length > 3 ? "grid-4" : "grid-3")}>
        {stepMeta.options.map(opt => (
          <OptionCard
            key={opt.id}
            opt={opt}
            selected={localSelected === opt.id}
            onSelect={handlePick}
          />
        ))}
      </div>

      {confirmedOpt && (
        <div className="feedback-box">
          <b>Why this matters:</b> {confirmedOpt.explain}
        </div>
      )}

      <div className="btn-row">
        <button
          className="btn"
          disabled={!confirmedOpt}
          style={!confirmedOpt ? { opacity: 0.4, cursor: "not-allowed" } : {}}
          onClick={() => confirmedOpt && onChoose(confirmedOpt)}
        >
          Confirm & Continue →
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   FINAL DASHBOARD
   ============================================================ */

function computeScore(metrics){
  const avg = (metrics.cost + metrics.speed + metrics.risk + metrics.satisfaction + metrics.sustainability) / 5;
  return Math.round(Math.max(0, Math.min(100, avg)));
}

function buildInsights(choices, metrics, company){
  const strengths = [];
  const weaknesses = [];

  const entries = [
    { label: "Cost Efficiency", value: metrics.cost, key: "cost" },
    { label: "Delivery Speed", value: metrics.speed, key: "speed" },
    { label: "Risk Control", value: metrics.risk, key: "risk" },
    { label: "Customer Satisfaction", value: metrics.satisfaction, key: "satisfaction" },
    { label: "Sustainability", value: metrics.sustainability, key: "sustainability" },
  ];

  entries.forEach(e => {
    if (e.value >= 62) strengths.push(e.label);
    if (e.value <= 40) weaknesses.push(e.label);
  });

  if (strengths.length === 0) strengths.push("A reasonably balanced overall setup");
  if (weaknesses.length === 0) weaknesses.push("No major weak spots — a well-rounded chain");

  // Determine biggest risk narrative
  let biggestRisk = "";
  if (choices.supplier.id === "single") {
    biggestRisk = "Your single-supplier strategy means one disruption (a factory issue, strike, or shipping delay at your supplier) could halt your entire production line.";
  } else if (choices.transport.id === "sea" && company.demand.level !== "Low") {
    biggestRisk = "You're using slow sea freight while facing " + company.demand.level.toLowerCase() + " demand — a sudden spike could leave customers waiting weeks for stock.";
  } else if (choices.inventory.id === "low" && choices.transport.id !== "air") {
    biggestRisk = "Your lean inventory combined with non-air transportation leaves little buffer if a shipment is delayed — stockouts are a real risk.";
  } else if (choices.factory.id === "offshore") {
    biggestRisk = "Your offshore factory is far from your customers, making you vulnerable to global disruptions like port congestion, tariffs, or geopolitical events.";
  } else if (metrics.risk < 45) {
    biggestRisk = "Your overall risk control is low — a combination of your choices leaves the chain exposed to disruption with little redundancy.";
  } else {
    biggestRisk = "Your biggest exposure is cost creep — several of your choices prioritize speed or satisfaction in ways that could strain margins if demand ever dips.";
  }

  // Improvements
  const improvements = [];
  if (choices.supplier.id === "single") {
    improvements.push("Add a backup supplier for your most critical materials to reduce concentration risk, even if it's just for 20-30% of volume.");
  }
  if (choices.warehouse.id === "centralized") {
    improvements.push("Consider adding at least one regional warehouse near your largest market to cut delivery times for your busiest customers.");
  }
  if (choices.transport.id === "sea" && choices.inventory.id === "low") {
    improvements.push("Since sea freight is slow, raise your safety stock levels slightly to avoid stockouts during long transit windows.");
  }
  if (choices.transport.id === "air" && metrics.sustainability < 45) {
    improvements.push("Reserve air freight only for urgent or high-value shipments, and shift routine orders to rail or sea to improve sustainability.");
  }
  if (choices.factory.id === "offshore" && metrics.risk < 55) {
    improvements.push("Explore a nearshore secondary factory to shorten lead times and reduce exposure to long-distance disruptions.");
  }
  if (metrics.cost < 45) {
    improvements.push("Review your highest-cost decisions (factory and transport) — even small efficiency gains here compound across every shipment.");
  }
  if (metrics.satisfaction < 45) {
    improvements.push("Customer satisfaction is lagging — faster delivery (regional warehouses or better transport) would likely have the biggest impact.");
  }
  if (improvements.length < 3) {
    improvements.push("Regularly re-forecast demand using sales data so your inventory strategy stays matched to real customer behavior.");
  }
  if (improvements.length < 3) {
    improvements.push("Build simple contingency plans (backup routes, backup suppliers) for your two riskiest decisions in this chain.");
  }
  if (improvements.length < 3) {
    improvements.push("Track sustainability metrics alongside cost — small transport method changes can meaningfully cut your carbon footprint.");
  }

  return {
    strengths: strengths.slice(0, 4),
    weaknesses: weaknesses.slice(0, 4),
    biggestRisk,
    improvements: improvements.slice(0, 3),
  };
}

function Dashboard({ company, choices, metrics, onReplay }){
  const score = computeScore(metrics);
  const insights = useMemo(() => buildInsights(choices, metrics, company), [choices, metrics, company]);
  const [animScore, setAnimScore] = useState(0);

  useEffect(() => {
    const t = setTimeout(() => setAnimScore(score), 150);
    return () => clearTimeout(t);
  }, [score]);

  let scoreLabel = "Needs Work";
  let scoreColor = "var(--danger)";
  if (score >= 75) { scoreLabel = "Excellent"; scoreColor = "var(--success)"; }
  else if (score >= 60) { scoreLabel = "Solid"; scoreColor = "var(--accent-2)"; }
  else if (score >= 45) { scoreLabel = "Average"; scoreColor = "var(--warn)"; }

  return (
    <div>
      <div className="card">
        <h2>📋 Final Supply Chain Dashboard — {company.companyName}</h2>
        <p>
          Here's how your supply chain design performed. This score reflects the combined balance
          of cost, speed, risk, customer satisfaction, and sustainability across all five decisions
          you made.
        </p>

        <div className="score-ring" style={{ ["--pct"]: animScore }}>
          <div className="score-ring-value">
            <div className="num" style={{ color: scoreColor }}>{animScore}</div>
            <div className="lbl">/ 100 · {scoreLabel}</div>
          </div>
        </div>

        <MetricsPanel metrics={metrics} />

        <div className="summary-grid">
          <div className="summary-card">
            <h4>✅ Strengths</h4>
            <ul className="list-check">
              {insights.strengths.map((s,i) => (
                <li key={i}><span className="ico">🟢</span><span>{s}</span></li>
              ))}
            </ul>
          </div>
          <div className="summary-card">
            <h4>⚠️ Weaknesses</h4>
            <ul className="list-check">
              {insights.weaknesses.map((w,i) => (
                <li key={i}><span className="ico">🟡</span><span>{w}</span></li>
              ))}
            </ul>
          </div>
        </div>

        <div className="risk-callout">
          <b>🔺 Biggest Risk:</b> {insights.biggestRisk}
        </div>

        <div className="summary-card" style={{marginTop:'18px'}}>
          <h4>🛠️ Three Practical Improvements</h4>
          <ul className="list-check">
            {insights.improvements.map((imp,i) => (
              <li key={i}><span className="ico">💡</span><span>{imp}</span></li>
            ))}
          </ul>
        </div>

        <h3 style={{marginTop:'26px'}}>🧾 Your Decisions Summary</h3>
        <div className="grid grid-3">
          {STEPS_META.map(step => {
            const c = choices[step.key];
            return (
              <div className="option-card selected" key={step.key} style={{cursor:'default'}}>
                <span className="option-icon">{c.icon}</span>
                <div className="option-title">{step.title.replace(/Step \d: /,'')}</div>
                <div className="option-desc">{c.title}</div>
              </div>
            );
          })}
        </div>

        <div className="btn-row">
          <button className="btn" onClick={onReplay}>🔁 Replay with a New Company</button>
        </div>
      </div>
      <div className="footer-note">Supply Chain Builder — a hands-on way to learn how global supply chains really work.</div>
    </div>
  );
}

/* ============================================================
   ROOT APP
   ============================================================ */

const SCREENS = {
  WELCOME: "welcome",
  COMPANY_INTRO: "company_intro",
  DECISION: "decision",
  DASHBOARD: "dashboard",
};

const BASE_METRICS = { cost: 50, speed: 50, risk: 50, satisfaction: 50, sustainability: 50 };

function clampMetrics(m){
  const out = {};
  Object.keys(m).forEach(k => { out[k] = Math.max(0, Math.min(100, m[k])); });
  return out;
}

function App(){
  const [screen, setScreen] = useState(SCREENS.WELCOME);
  const [company, setCompany] = useState(() => generateCompany());
  const [stepIndex, setStepIndex] = useState(0);
  const [choices, setChoices] = useState({});
  const [metrics, setMetrics] = useState(BASE_METRICS);

  const startGame = () => {
    setCompany(generateCompany());
    setScreen(SCREENS.COMPANY_INTRO);
  };

  const beginDecisions = () => {
    setStepIndex(0);
    setChoices({});
    setMetrics(clampMetrics({ ...BASE_METRICS }));
    setScreen(SCREENS.DECISION);
  };

  const handleChoice = (opt) => {
    const stepMeta = STEPS_META[stepIndex];
    const newChoices = { ...choices, [stepMeta.key]: opt };
    const demandMult = company.demand.mult;
    const eff = opt.effects;
    const newMetrics = clampMetrics({
      cost: metrics.cost + eff.cost * (stepMeta.key === "inventory" ? demandMult : 1),
      speed: metrics.speed + eff.speed * (stepMeta.key === "transport" ? demandMult : 1),
      risk: metrics.risk + eff.risk,
      satisfaction: metrics.satisfaction + eff.satisfaction * (demandMult),
      sustainability: metrics.sustainability + eff.sustainability,
    });
    setChoices(newChoices);
    setMetrics(newMetrics);

    if (stepIndex < STEPS_META.length - 1) {
      setStepIndex(stepIndex + 1);
    } else {
      setScreen(SCREENS.DASHBOARD);
    }
  };

  const replay = () => {
    const newCompany = generateCompany();
    setCompany(newCompany);
    setStepIndex(0);
    setChoices({});
    setMetrics(clampMetrics({ ...BASE_METRICS }));
    setScreen(SCREENS.COMPANY_INTRO);
  };

  const currentStepMeta = STEPS_META[stepIndex];

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand">
          <span className="brand-dot"></span>
          Supply Chain Builder
        </div>
        {screen === SCREENS.DECISION && (
          <div className="step-pill">Step {stepIndex + 1} of {STEPS_META.length}</div>
        )}
        {screen === SCREENS.DASHBOARD && (
          <div className="step-pill">Final Report</div>
        )}
      </div>

      {screen === SCREENS.WELCOME && (
        <WelcomeScreen onStart={startGame} />
      )}

      {screen === SCREENS.COMPANY_INTRO && (
        <CompanyIntroScreen company={company} onContinue={beginDecisions} />
      )}

      {screen === SCREENS.DECISION && (
        <div className="layout">
          <div>
            <ProgressHeader stepIndex={stepIndex} totalSteps={STEPS_META.length} />
            <div className="explain-box">
              <b>Company recap:</b> {company.companyName} ({company.industry.name}) serves{" "}
              {company.countries.join(", ")} with {company.demand.level.toLowerCase()} demand.
            </div>
            <DecisionScreen
              key={currentStepMeta.key}
              stepMeta={currentStepMeta}
              choice={choices[currentStepMeta.key]}
              onChoose={handleChoice}
            />
          </div>
          <MetricsPanel metrics={metrics} />
        </div>
      )}

      {screen === SCREENS.DASHBOARD && (
        <Dashboard
          company={company}
          choices={choices}
          metrics={metrics}
          onReplay={replay}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
